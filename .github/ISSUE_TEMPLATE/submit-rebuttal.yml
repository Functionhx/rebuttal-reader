name: Submit your rebuttal
description: 分享你有权公开的 Rebuttal、Response Letter 或公开讨论
title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意把一次真实的同行评议经历留给社区。

        Accepted、Rejected、Withdrawn 或仍在讨论中的案例都欢迎。请只提交你有权公开、且不包含机密信息的材料；如果不方便公开完整 Review，也可以只提交作者回复。

  - type: input
    id: paper_title
    attributes:
      label: 论文标题
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: venue
    attributes:
      label: 会议 / 期刊与年份
      placeholder: 例如 ICLR 2026、CVPR 2025、TMLR 2024
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: 材料类型
      options:
        - Conference rebuttal
        - Response to reviewers
        - Public discussion
        - 其他公开同行评议材料
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: 论文链接
      description: DOI、arXiv、OpenReview Forum、项目主页或其他可核验链接
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: material_url
    attributes:
      label: Rebuttal / Response 的公开链接
      description: OpenReview Forum、GitHub、项目主页或其他公开地址；如需附加文件，可在下方补充说明中拖入。
      placeholder: https://...

  - type: dropdown
    id: outcome
    attributes:
      label: 最终结果
      description: 这不是排名字段，只用于还原完整投稿经历。
      options:
        - Accepted
        - Rejected
        - Withdrawn
        - Pending / In discussion
        - Prefer not to say

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 可说明匿名方式、公开范围、许可、数据缺失或希望重点展示的讨论。也可以在这里拖入你有权公开的文件。
      placeholder: Optional context

  - type: checkboxes
    id: rights
    attributes:
      label: 公开与隐私确认
      options:
        - label: 我是作者 / 权利人，或这些材料已经由可信来源公开，并有权提交。
          required: true
        - label: 我已移除不应公开的 Reviewer 身份、邮箱和机密评论。
          required: true
        - label: 此提交符合相关会议、期刊与投稿系统的公开政策。
          required: true
        - label: 我同意项目索引并格式化展示这些材料，也理解权利人可以请求更正或删除。
          required: true
