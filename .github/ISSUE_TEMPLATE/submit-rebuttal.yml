name: Submit a rebuttal (English)
description: Share a rebuttal, response letter, or public peer-review discussion you are authorized to publish
title: "[Rebuttal Submission] "
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for contributing to Rebuttal Reader

        Every real peer-review story can help someone write a clearer, stronger response. We welcome **accepted, rejected, withdrawn, pending, and still-under-discussion** submissions alike.

        Please submit only materials that you are authorized to share and that contain no confidential information. If the complete reviews cannot be made public, you may submit the author response on its own.

  - type: input
    id: paper_title
    attributes:
      label: Paper title
      description: Enter the complete title of the paper or manuscript.
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: venue
    attributes:
      label: Venue and year
      description: Conference, journal, workshop, or other peer-review venue.
      placeholder: e.g. ICLR 2026, CVPR 2025, or TMLR 2024
    validations:
      required: true

  - type: dropdown
    id: material_type
    attributes:
      label: Material type
      options:
        - Conference rebuttal
        - Response to reviewers
        - Public discussion
        - Other public peer-review material
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: Provide a DOI, arXiv page, OpenReview forum, project page, or another verifiable source.
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: material_url
    attributes:
      label: Public rebuttal or response URL
      description: Link to OpenReview, GitHub, a project page, or another public source. To attach a file, drag it into the additional context field below.
      placeholder: https://...

  - type: dropdown
    id: outcome
    attributes:
      label: Final outcome
      description: This is not a ranking signal; it only helps us preserve the full submission story.
      options:
        - Accepted
        - Rejected
        - Withdrawn
        - Pending / In discussion
        - Prefer not to say

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Tell us about anonymization, publication scope, licensing, missing data, or discussions worth highlighting. You may also drag in files that you are authorized to share.
      placeholder: Optional context

  - type: checkboxes
    id: rights
    attributes:
      label: Rights and privacy confirmation
      description: All four confirmations are required before we can review your submission.
      options:
        - label: I am an author or rights holder, or these materials were already published by a trustworthy source, and I am authorized to submit them.
          required: true
        - label: I have removed any reviewer identities, email addresses, and confidential comments that should not be made public.
          required: true
        - label: This submission complies with the disclosure policies of the relevant conference, journal, and submission platform.
          required: true
        - label: I consent to this project indexing, formatting, and displaying these materials, and I understand that rights holders may request a correction or removal.
          required: true
